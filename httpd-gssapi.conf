<VirtualHost *:8000>
    ServerAlias *
    CustomLog /var/log/apache2/access.log common

    ErrorDocument 400 " "
    ErrorDocument 401 " "
    ErrorDocument 403 " "
    ErrorDocument 404 " "
    ErrorDocument 500 " "
    ErrorDocument 503 " "

    <Location />
        AuthType GSSAPI
        AuthName "Centralized Kerberos Authentication"
        Require valid-user

        RewriteEngine On

        RewriteCond %{LA-U:REMOTE_USER} ^([^@]+)@
        RewriteRule .* - [E=CLEAN_USER:%1]

        Header set X-Remote-User %{CLEAN_USER}e env=CLEAN_USER
        Header set X-Remote-User %{LA-U:REMOTE_USER}s env=!CLEAN_USER
    </Location>
</VirtualHost>
